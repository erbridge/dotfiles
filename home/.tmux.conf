unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind R source-file "~/.tmux.conf" ; display "Re-sourced ~/.tmux.conf"

set -g mouse on

set -g display-time 2000

# DESIGN TWEAKS
# Originally from https://hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

# # Don't do anything when a 'bell' rings.
# set -g visual-activity off
# set -g visual-bell off
# set -g visual-silence off
# setw -g monitor-activity off
# set -g bell-action none

# Clock mode
setw -g clock-mode-colour blue

# Copy mode
setw -g mode-style "fg=black bg=green bold"

# Panes
set -g pane-border-style "fg=green"
set -g pane-active-border-style "fg=blue"

# Statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style ""

set -g pane-border-status bottom
set -g pane-border-style "fg=black"
set -g pane-border-format ""

set -g status-left "#S "
set -g status-left-length 10

# set -g status-right " #(KUBE_TMUX_SYMBOL_ENABLE=false /bin/bash $TMUX_PLUGIN_MANAGER_PATH/kube-tmux/kube.tmux white white yellow) #{tmux_mode_indicator}"
set -g status-right " #{tmux_mode_indicator}"
set -g status-right-length 50

setw -g window-status-current-style "fg=black bg=green"
setw -g window-status-current-format " #I #W #F "

setw -g window-status-style "fg=green bg=black"
setw -g window-status-format " #I #[fg=white]#W #[fg=blue]#F "

setw -g window-status-bell-style "fg=white bg=red"

# Messages
set -g message-style "fg=white bg=red"

# /DESIGN TWEAKS

set -g @continuum-restore "on"
set -g @continuum-save-interval "5"

# ¿ is M-? on macos.
set -g @menus_trigger ¿
set -g @menus_without_prefix true

set -g @mode_indicator_prefix_mode_style "bg=blue,fg=black"
set -g @mode_indicator_empty_mode_style "bg=green,fg=black"

set -g @plugin "jaclu/tmux-menus"
set -g @plugin "jonmosco/kube-tmux"
set -g @plugin "MunifTanjim/tmux-mode-indicator"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tpm"

# Install tpm if it isn't.
if "test ! -d ~/.tmux/plugins/tpm" "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Must be last.
run "~/.tmux/plugins/tpm/tpm"
