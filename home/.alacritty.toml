[window]
dimensions = { columns = 80, lines = 64 }
padding = { x = 10, y = 15 }
dynamic_padding = true
decorations = "none"
resize_increments = true

[scrolling]
history = 100000

[font]
normal = { family = "FiraCode Nerd Font Mono", style = "Regular" }
size = 13

